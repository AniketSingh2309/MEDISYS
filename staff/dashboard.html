<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Staff Portal</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <h1 id="welcomeHeading">Welcome</h1>
    <p class="portal-subtitle" id="staffSubtitle"></p>

    <div class="portal-toolbar-cards" id="staffActionCards"></div>

    <div class="portal-card">
      <div class="module-card-grid" id="staffModuleGrid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>STAFF PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="staff.js"></script>
</body>
</html>
