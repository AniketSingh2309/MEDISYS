<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - My Queue</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard.html" class="forgot-link portal-back-link">&larr; Back to Dashboard</a>
    <h1>My Queue</h1>
    <p class="portal-subtitle">Today's patients.</p>

    <div class="portal-card">
      <table class="portal-table" id="queueTable">
        <thead><tr><th>Token</th><th>Patient</th><th>Time</th><th>Status</th><th></th></tr></thead>
        <tbody id="queueTableBody"></tbody>
      </table>
      <p class="portal-empty" id="queueEmptyState" hidden>No patients in your queue today.</p>
    </div>

    <div id="consultSection" class="portal-card" hidden>
      <h2 id="consultTitle">Consultation</h2>

      <div class="chart-section">
        <h2 class="chart-section-title">Patient History</h2>
        <div id="historyFeed"></div>
      </div>

      <div class="wizard-step" style="margin-top: 20px;">
        <label for="symptoms">Symptoms</label>
        <textarea id="symptoms"></textarea>

        <label for="consultNotes">Notes</label>
        <textarea id="consultNotes"></textarea>

        <label for="decision">Decision</label>
        <select id="decision">
          <option value="prescribe">Prescribe medicine only</option>
          <option value="order_tests">Order lab/radiology tests</option>
          <option value="admit">Requires admission</option>
        </select>

        <div id="testOrderSection" hidden style="margin-top: 12px;">
          <label for="testSearchInput">Search tests</label>
          <div id="selectedTestChips" class="test-chip-row"></div>
          <input type="text" id="testSearchInput" placeholder="Type a test name (e.g. CBC, LFT, Chest X-Ray)..." autocomplete="off" />
          <div id="testSearchResults" class="test-search-results"></div>
        </div>

        <div id="pharmacyOrderSection" hidden style="margin-top: 12px; background: #f0f8ff; padding: 15px; border-radius: 8px; border: 1px solid #bce8f1;">
          <h3 style="margin-top: 0; color: #31708f; font-size: 14px;">Prescribe Medicine</h3>
          <label for="medName">Medicine Name</label>
          <input type="text" id="medName" placeholder="e.g. Paracetamol 500mg" autocomplete="off" style="margin-bottom: 10px;" />
          
          <div style="display: flex; gap: 10px;">
            <div style="flex: 2;">
              <label for="medDosage">Dosage</label>
              <select id="medDosage">
                <option value="">Select Dosage</option>
                <option value="1-0-1 (Morning & Evening)">1-0-1 (Morning & Evening)</option>
                <option value="1-1-1 (Three times a day)">1-1-1 (Three times a day)</option>
                <option value="1-0-0 (Morning only)">1-0-0 (Morning only)</option>
                <option value="0-0-1 (Night only)">0-0-1 (Night only)</option>
                <option value="SOS (As needed)">SOS (As needed)</option>
              </select>
            </div>
            <div style="flex: 1;">
              <label for="medDuration">Duration (Days)</label>
              <input type="number" id="medDuration" min="1" max="30" placeholder="e.g. 5" />
            </div>
            <div style="flex: 1;">
              <label for="medUrgency">Urgency</label>
              <select id="medUrgency">
                <option value="routine">Routine</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>
        </div>

        <p class="form-error" id="consultError" role="alert" aria-live="polite"></p>

        <div class="wizard-nav">
          <button type="button" class="login-btn wizard-next-btn" id="completeConsultBtn">Complete Consultation</button>
        </div>
        <p class="wizard-hint" id="consultConfirmation"></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="doctor-queue.js"></script>
</body>
</html>
