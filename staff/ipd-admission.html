<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Admission Request</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard.html" class="forgot-link portal-back-link">&larr; Back to Dashboard</a>
    <h1>Admission Request</h1>
    <p class="portal-subtitle">Initiate a direct IPD admission for a patient.</p>

    <div class="portal-card wizard-step">
      <label for="patientSearch">Search patient by name, phone, or UHID</label>
      <input type="text" id="patientSearch" placeholder="e.g. Ramesh, 98765xxxxx, PAT-CHG-000001" />
      <div id="searchResults" class="staff-roster-grid patient-search-results"></div>
      <p class="wizard-hint" id="selectedPatientHint"></p>
    </div>

    <div class="portal-card">
      <form id="admissionForm" class="wizard-step" novalidate>
        <label for="doctorSelect">Admitting Doctor</label>
        <select id="doctorSelect"></select>

        <label class="module-check" style="margin-top: 16px;">
          <input type="checkbox" id="consentObtained" />
          Consent form obtained
        </label>

        <label for="idProofNote">ID Proof</label>
        <input type="text" id="idProofNote" placeholder="e.g. Aadhaar verified, copy on file" />

        <p class="form-error" id="admissionFormError" role="alert" aria-live="polite"></p>

        <div class="wizard-nav">
          <button type="submit" class="login-btn wizard-next-btn" id="submitAdmissionBtn">Submit Admission Request</button>
        </div>
      </form>

      <div id="admissionResult" class="wizard-result" hidden>
        <h2>Admission Request Created</h2>
        <p>This patient is now in the pending list for bed allocation by a nurse/ward admin.</p>
        <a href="dashboard.html" class="login-btn portal-register-btn wizard-done-btn">Back to Dashboard</a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="ipd-admission.js"></script>
</body>
</html>
