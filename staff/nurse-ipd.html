<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - IPD Patients</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard.html" class="forgot-link portal-back-link">&larr; Back to Dashboard</a>
    <h1>IPD Patients</h1>
    <p class="portal-subtitle">Select an admitted patient to log medication administered.</p>

    <div class="portal-card wizard-step">
      <label for="admissionSelect">Admitted Patient</label>
      <select id="admissionSelect"></select>
    </div>

    <div id="workspace" hidden>
      <div class="portal-card">
        <div class="chart-section">
          <h2 class="chart-section-title">Doctor's Orders</h2>
          <div id="ordersFeed"></div>
        </div>

        <div class="chart-section">
          <h2 class="chart-section-title">Log Medication Administered</h2>
          <div class="wizard-grid">
            <div>
              <label for="medicineName">Medicine</label>
              <input type="text" id="medicineName" />
            </div>
            <div>
              <label for="dose">Dose</label>
              <input type="text" id="dose" placeholder="e.g. 500mg" />
            </div>
          </div>
          <label for="marNotes">Notes</label>
          <input type="text" id="marNotes" placeholder="Optional" />
          <div class="wizard-nav">
            <button type="button" class="login-btn wizard-next-btn" id="logMarBtn">Log Dose</button>
          </div>
          <div id="marFeed"></div>
        </div>

        <p class="form-error" id="ipdError" role="alert" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="../portal-ui.js"></script>
<script src="nurse-ipd.js"></script>
</body>
</html>
