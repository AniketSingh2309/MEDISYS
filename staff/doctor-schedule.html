<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - My Schedule</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard.html" class="forgot-link portal-back-link">&larr; Back to Dashboard</a>
    <h1>My Schedule</h1>
    <p class="portal-subtitle">Define your recurring weekly availability. Patients book slots from these blocks.</p>

    <div class="portal-card wizard-step">
      <h2>Add Availability Block</h2>
      <div class="wizard-grid">
        <div>
          <label for="dayOfWeek">Day</label>
          <select id="dayOfWeek">
            <option value="0">Sunday</option>
            <option value="1">Monday</option>
            <option value="2">Tuesday</option>
            <option value="3">Wednesday</option>
            <option value="4">Thursday</option>
            <option value="5">Friday</option>
            <option value="6">Saturday</option>
          </select>
        </div>
        <div>
          <label for="startTime">Start Time</label>
          <input type="time" id="startTime" value="09:00" />
        </div>
        <div>
          <label for="endTime">End Time</label>
          <input type="time" id="endTime" value="13:00" />
        </div>
        <div>
          <label for="slotMinutes">Slot Length (min)</label>
          <input type="number" id="slotMinutes" value="15" min="5" />
        </div>
      </div>
      <p class="form-error" id="scheduleFormError" role="alert" aria-live="polite"></p>
      <div class="wizard-nav">
        <button type="button" class="login-btn wizard-next-btn" id="addBlockBtn">Add Block</button>
      </div>
    </div>

    <h2 class="portal-section-title">Current Availability</h2>
    <div class="portal-card">
      <table class="portal-table" id="scheduleTable">
        <thead><tr><th>Day</th><th>Start</th><th>End</th><th>Slot Length</th><th></th></tr></thead>
        <tbody id="scheduleTableBody"></tbody>
      </table>
      <p class="portal-empty" id="scheduleEmptyState" hidden>No availability set yet.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="doctor-schedule.js"></script>
</body>
</html>
