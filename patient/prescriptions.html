<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - My Prescriptions</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard.html" class="forgot-link portal-back-link">&larr; Back to Dashboard</a>
    <h1>Prescriptions</h1>
    <p class="portal-subtitle">Medicines your doctor has prescribed and their dispense status at the pharmacy.</p>

    <div class="portal-card">
      <table class="portal-table" id="prescriptionsTable">
        <thead><tr><th>Medicine</th><th>Dosage</th><th>Duration</th><th>Food Instruction</th><th>Urgency</th><th>Status</th><th>Prescribed</th></tr></thead>
        <tbody id="prescriptionsTableBody"></tbody>
      </table>
      <p class="portal-empty" id="prescriptionsEmptyState" hidden>No prescriptions on file yet.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>PATIENT PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
<script src="prescriptions.js"></script>
</body>
</html>
