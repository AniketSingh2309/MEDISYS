<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Patient Portal</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn" data-i18n="common.logout">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <div id="diseaseAlertsSection" hidden></div>

    <h1 id="welcomeHeading">Welcome</h1>
    <p class="portal-subtitle" id="patientSubtitle"></p>

    <div id="abhaStatusCard"></div>

    <div class="portal-toolbar-cards" id="patientActionCards"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>PATIENT PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="../realtime-client.js"></script>
  <script src="../portal-ui.js"></script>
<script src="patient.js"></script>
</body>
</html>
