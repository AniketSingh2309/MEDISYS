<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Existing Staff</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard.html" class="forgot-link portal-back-link">&larr; Back to Dashboard</a>
    <h1>Existing Staff</h1>
    <p class="portal-subtitle">All staff registered for your hospital, grouped by department.</p>

    <div id="staffEmptyState" class="portal-card portal-empty" hidden>
      <p>No staff registered yet.</p>
      <a href="add-staff.html" class="forgot-link">Add your first staff member &rarr;</a>
    </div>

    <div id="staffGroups"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="hospital.js"></script>
</body>
</html>
