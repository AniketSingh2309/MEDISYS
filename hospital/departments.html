<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Departments</title>
<link rel="stylesheet" href="../style.css" />
<link rel="stylesheet" href="../admin/admin.css" />
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img src="../logo.png" alt="Core5 MEDISYS" class="brand-logo" />
    </div>
    <div class="portal-header-right">
      <span class="portal-user" id="portalUser"></span>
      <button type="button" class="portal-logout-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="portal-main">
    <a href="dashboard.html" class="forgot-link portal-back-link">&larr; Back to Dashboard</a>
    <h1>Departments</h1>
    <p class="portal-subtitle">Departments/specializations doctors can be assigned to. Receptionists filter doctors by department when booking OPD visits.</p>

    <div class="portal-card wizard-step">
      <label for="departmentName">Department Name</label>
      <div class="wizard-suggest-row">
        <input type="text" id="departmentName" placeholder="e.g. Cardiology, Orthopedics, Pediatrics" />
        <button type="button" class="wizard-suggest-btn" id="addDepartmentBtn">Add Department</button>
      </div>
      <p class="form-error" id="departmentFormError" role="alert" aria-live="polite"></p>
    </div>

    <h2 class="portal-section-title">Existing Departments</h2>
    <div class="portal-card">
      <table class="portal-table" id="departmentsTable">
        <thead><tr><th>Department</th><th></th></tr></thead>
        <tbody id="departmentsTableBody"></tbody>
      </table>
      <p class="portal-empty" id="departmentsEmptyState" hidden>No departments added yet.</p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-left">
      <span class="footer-brand">CORE5 <strong>MEDISYS</strong></span>
      <small>HOSPITAL PORTAL</small>
    </div>
    <div class="footer-right">&copy;2026 Core5. All rights reserved.</div>
  </footer>

  <script src="hospital.js"></script>
</body>
</html>
