<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MEDISYS - Smarter Healthcare. Better Outcomes.</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="login.css?v=9" />
<link rel="stylesheet" href="css/language-selector.css" />
</head>
<body>

  <div class="lp-page">
    <div class="lp-header-lang">
      <div class="medisys-lang-container"></div>
    </div>
    <img src="login-bg.png" alt="Empowering Hospitals. Enhancing Care. MEDISYS HMIS" class="lp-bg-image" />

    <div class="lp-right">
      <form class="lp-card" id="loginForm" novalidate>
        <div class="lp-card-icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V7l8-4 8 4v14"/><path d="M9 21v-6h6v6"/><path d="M9 11h.01M15 11h.01M12 11h.01M9 7h.01M15 7h.01M12 7h.01"/></svg>
        </div>

        <h2 data-i18n="login.title">Sign in</h2>
        <p class="lp-card-subtitle" data-i18n="login.subtitle">Access your HMIS dashboard</p>

        <label class="lp-field-label" for="userId" data-i18n="login.user_id">User ID</label>
        <div class="lp-input-wrap">
          <span class="lp-input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 21c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/></svg>
          </span>
          <input type="text" id="userId" name="userId" placeholder="Enter User ID" data-i18n-placeholder="login.enter_user_id" autocomplete="username" required />
        </div>

        <label class="lp-field-label" for="password" data-i18n="login.password">Password</label>
        <div class="lp-input-wrap">
          <span class="lp-input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <input type="password" id="password" name="password" placeholder="Enter Password" data-i18n-placeholder="login.enter_password" autocomplete="current-password" required />
          <button type="button" class="lp-toggle-password" id="togglePassword" aria-label="Show password" data-i18n-aria-label="login.toggle_password" data-i18n-title="login.toggle_password">
            <svg id="eyeIcon" viewBox="0 0 24 24" width="18" height="18"><path fill="#8a97a8" d="M12 5c-5 0-9.3 3.1-11 7 1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg>
          </button>
        </div>

        <label class="lp-field-label" for="captchaInput" data-i18n="login.captcha">Captcha</label>
        <div class="lp-captcha-row">
          <span class="lp-captcha-code" id="captchaCode"></span>
          <button type="button" class="lp-captcha-refresh-btn" id="refreshCaptcha" aria-label="Refresh captcha" data-i18n-aria-label="login.refresh_captcha" data-i18n-title="login.refresh_captcha">&#8635;</button>
          <input type="text" id="captchaInput" name="captcha" placeholder="Enter Captcha" data-i18n-placeholder="login.enter_captcha" autocomplete="off" required />
        </div>

        <div class="lp-options-row">
          <label class="lp-remember"><input type="checkbox" id="rememberMe" /> <span data-i18n="login.remember_me">Remember me</span></label>
          <a href="#" class="lp-forgot-link" id="forgotPasswordLink" data-i18n="login.forgot_password">Forgot Password?</a>
        </div>

        <p class="form-error" id="formError" role="alert" aria-live="polite"></p>

        <button type="submit" class="lp-submit-btn" data-i18n="login.submit">LOGIN</button>
      </form>

      <form class="lp-card" id="forgotPasswordForm" novalidate hidden>
        <div class="lp-card-icon">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
        </div>

        <h2 data-i18n="login.reset_title">Reset Password</h2>
        <p class="lp-card-subtitle" data-i18n="login.reset_subtitle">Set a new password for your account</p>

        <label class="lp-field-label" for="resetUserId" data-i18n="login.user_id">User ID</label>
        <div class="lp-input-wrap">
          <span class="lp-input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 21c0-3.6 2.9-6.2 6.5-6.2s6.5 2.6 6.5 6.2"/></svg>
          </span>
          <input type="text" id="resetUserId" name="resetUserId" placeholder="Enter User ID" data-i18n-placeholder="login.enter_user_id" autocomplete="username" required />
        </div>

        <label class="lp-field-label" for="newPassword" data-i18n="login.new_password">New Password</label>
        <div class="lp-input-wrap">
          <span class="lp-input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" data-i18n-placeholder="login.enter_new_password" autocomplete="new-password" minlength="6" required />
        </div>

        <label class="lp-field-label" for="confirmPassword" data-i18n="login.confirm_password">Confirm Password</label>
        <div class="lp-input-wrap">
          <span class="lp-input-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
          </span>
          <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter new password" data-i18n-placeholder="login.enter_confirm_password" autocomplete="new-password" minlength="6" required />
        </div>

        <p class="form-error" id="resetError" role="alert" aria-live="polite"></p>

        <button type="submit" class="lp-submit-btn" data-i18n="login.reset_submit">SET NEW PASSWORD</button>

        <div class="lp-options-row lp-options-row-center">
          <a href="#" class="lp-forgot-link" id="backToLoginLink" data-i18n="login.back_to_login">&larr; Back to Login</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/language-manager.js"></script>
  <script src="js/language-selector.js"></script>
  <script src="script.js"></script>
</body>
</html>
